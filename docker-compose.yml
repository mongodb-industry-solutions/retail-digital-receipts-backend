## --- docker-compose.yml ---
services:
  invoice-ms:
    build:
      context: ./services/invoice-ms
      dockerfile: Dockerfile
    container_name: invoice-ms
    ports:
      - "8000:8000"
    networks:
      - backend-net
    env_file:
      - ./services/invoice-ms/.env
    # For local Azure CLI auth (only uncomment for dev)
    # volumes:
    #   - $HOME/.azure:/root/.azure

  recommendation-ms:
    build:
      context: ./services/recommendation-ms
      dockerfile: Dockerfile
    container_name: recommendation-ms
    ports:
      - "8001:8000"
    networks:
      - backend-net
    env_file:
      - ./services/recommendation-ms/.env

networks:
  backend-net:
