
services:
  invoice-ms:
    build:
      context: ./services/invoice-ms
      dockerfile: Dockerfile
    container_name: invoice-ms
    ports:
      - "8000:8000"
    networks:
      - backend-net
    env_file:
      - ./services/invoice-ms/.env
    #the next line mounts your Azure login session into the container
    # Only needed for local development with az login, you can comment on production
    volumes:
     - $HOME/.azure:/root/.azure

  recommendation-ms:
    build:
      context: ./services/recommendation-ms
      dockerfile: Dockerfile
    container_name: recommendation-ms
    ports:
      - "8001:8000"  # Assuming recommendation-ms listens internally on 8000
    networks:
      - backend-net
    env_file:
      - ./services/recommendation-ms/.env

networks:
  backend-net:
