[tool.poetry]
name = "invoice-ms"
version = "0.1.0"
description = "Invoice Microservice for handling order-based invoices"
authors = ["Florencia Arin <florencia.arin@mongodb.com>"]
readme = "README.md"
packages = [{ include = "app" }]  # Add this line to specify where the source code is

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pymongo = "^4.10.1"
python-dotenv = "^1.0.1"
fastapi = "^0.115.4"
uvicorn = "^0.32.0"
azure-functions = "^1.12.0"
azure-storage-blob = "^12.10.0"
motor = "^3.7.0"
pydantic = ">=2.7,<3.0"
pydantic-settings = "^2.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
