env:
  NODE_ENV: "production"
  PORT: "8080"

envSecrets:
  MONGODB_URI: invoice-ms-prod-secrets
  DATABASE_NAME: invoice-ms-prod-secrets
  AZURE_BLOB_CONTAINER_NAME: invoice-ms-prod-secrets
  AZURE_BLOB_ACCOUNT_URL: invoice-ms-prod-secrets
  ORIGINS: invoice-ms-prod-secrets
  AZURE_METADATA_ENDPOINT: invoice-ms-prod-secrets
  STORE_URL: invoice-ms-prod-secrets

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "1024Mi"

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: flor.arin@mongodb.com